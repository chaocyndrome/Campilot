<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campilot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <h1 class="brand">
        <img src="{{ url_for('static', filename='img/campilot-logo.png') }}" alt="Campilot">
      </h1>
      <nav class="nav">
        <a href="{{ url_for('today') }}" class="{% if active_page == 'today' %}active{% endif %}">今日任务</a>
        <a href="{{ url_for('timeline') }}" class="{% if active_page == 'timeline' %}active{% endif %}">本周时间线</a>
        <a href="{{ url_for('manage') }}" class="{% if active_page == 'manage' %}active{% endif %}">添加/管理</a>
        <a href="{{ url_for('rewards') }}" class="{% if active_page == 'rewards' %}active{% endif %}">奖励/成就</a>
      </nav>
    </div>
  </header>

  {% with flashed_messages = get_flashed_messages(with_categories=true) %}
    {% if flashed_messages %}
    <section class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true">
      {% for category, message in flashed_messages %}
      <div class="toast toast-{{ 'error' if category in ['error', 'danger'] else category if category in ['success', 'warning', 'info'] else 'info' }}" role="status">
        {{ message }}
      </div>
      {% endfor %}
    </section>
    {% endif %}
  {% endwith %}

  <main class="container page-content">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
